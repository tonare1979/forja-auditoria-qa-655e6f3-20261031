name: FORJA evolucao offline iPhone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Testar tela Evolucao sem rede
        run: |
          cat >/tmp/evolucao.cjs <<'JS'
          const {webkit,devices}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await webkit.launch(),ctx=await b.newContext({...devices['iPhone 13']});
            const page=await ctx.newPage();
            await page.goto('https://forja-v11-rc3-preview-isolada.renatodesouza79.workers.dev/',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              cloud.user={username:'qa-local',role:'athlete'};
              tab='progresso';
              const root=document.createElement('div');root.innerHTML='<div id="photoGallery"></div><div id="bioHistory"></div><p id="fxMessage"></p>';document.body.append(root);
            });
            await ctx.setOffline(true);
            const result=await page.evaluate(async()=>{
              await fxLoadEvolution();
              return {photo:document.querySelector('#photoGallery').textContent,body:document.querySelector('#bioHistory').textContent,status:document.querySelector('#fxMessage').textContent};
            });
            if(!result.photo.includes('reconexão')||!result.body.includes('reconexão')||!result.status.includes('Sem internet'))throw Error('OFFLINE_UI_MISSING '+JSON.stringify(result));
            console.log('EVOLUCAO_OFFLINE_WEBKIT_OK');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/evolucao.cjs
