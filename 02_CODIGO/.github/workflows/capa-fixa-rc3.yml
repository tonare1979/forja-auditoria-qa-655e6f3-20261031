name: Capa FORJA sob demanda
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remover transição automática da capa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text()
          target='setTimeout(finishSplash,2400);'
          assert s.count(target)==1, 'Temporizador inesperado; abortar alteração'
          assert "cover.querySelector('button')?.addEventListener('click',e=>{e.stopPropagation();finishSplash()});" in s
          assert "if(!cloud.user&&tab!=='nuvem')" in s, 'Guarda pré-login ausente; abortar'
          s=s.replace(target,'// A capa permanece visível até o usuário tocar em ENTRAR.')
          p.write_text(s)
          Path('/tmp/forja-inline.js').write_text('\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)))
          print('Capa permanece até clique explícito; privacidade preservada')
          PY
          node --check /tmp/forja-inline.js
      - name: Commit
        run: |
          git config user.name "FORJA RC3"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: manter capa até toque no botão Entrar"
          git push
