name: FORJA video callsites
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text()
          p=0
          while True:
            i=s.find('video(',p)
            if i<0:break
            print('VIDEO_CALL:',repr(s[max(0,i-180):i+200]))
            p=i+6
          PY
