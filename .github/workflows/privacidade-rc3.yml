name: Corrigir privacidade RC3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trancar módulos antes do login
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/index.html')
          s=p.read_text()
          fixes=[
            ("function render(){if(tab==='painel')","function render(){if(!cloud.user&&tab!=='nuvem')tab='nuvem';if(tab==='painel')"),
            ("function nav(){const items=","function nav(){if(!cloud.user){$('nav').innerHTML='';$('nav').hidden=true;return}$('nav').hidden=false;const items="),
            ("if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}","if(t.dataset.tab){tab=(!cloud.user&&t.dataset.tab!=='nuvem')?'nuvem':t.dataset.tab;render();scrollTo(0,0);return}"),
          ]
          for a,b in fixes:
            if s.count(a)!=1: raise SystemExit('Expected exactly once: '+a)
            s=s.replace(a,b)
          # Logout must always send the user back to login.
          a="cloud.user=null;cloud.linked=false;cloud.dirty=false;cloud.conflict=false;"
          b="cloud.user=null;tab='nuvem';cloud.linked=false;cloud.dirty=false;cloud.conflict=false;"
          if s.count(a)!=1: raise SystemExit('Logout structure changed')
          s=s.replace(a,b)
          assert '<img class="welcome-brand"' not in s
          p.write_text(s)
          m=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/forja.js').write_text('\n'.join(m))
          print('Guarda aplicada a render, navegação e logout')
          PY
          node --check /tmp/forja.js
      - name: Salvar
        run: |
          git config user.name "FORJA RC3"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: impedir acesso a séries antes do login"
          git push
