name: Identidade FORJA RC3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Gerar ícones e atualizar abertura
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json
          root=Path('public')
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          assert Path(font).exists()
          for size in (180,192,512):
              scale=3
              d=size*scale
              im=Image.new('RGB',(d,d),(12,16,13))
              dr=ImageDraw.Draw(im)
              thick=max(3,d//105)
              dr.rounded_rectangle((thick,thick,d-thick,d-thick),radius=d//5,outline=(205,247,89),width=thick*2)
              ft=ImageFont.truetype(font,int(d*.70))
              bounds=dr.textbbox((0,0),'F',font=ft,stroke_width=0)
              x=int(d*.13)-bounds[0];y=int(d*.045)-bounds[1]
              dr.text((x,y),'F',font=ft,fill=(250,251,250),stroke_width=0)
              rr=int(d*.080);cx=int(d*.77);cy=int(d*.72)
              dr.ellipse((cx-rr,cy-rr,cx+rr,cy+rr),fill=(205,247,89))
              im.resize((size,size),Image.Resampling.LANCZOS).save(root/f'forja-icon-rc3-{size}.png',optimize=True)
          p=root/'index.html'
          s=p.read_text()
          old='<img class="welcome-art" src="./forja-cover-rio-casal-v2.png" alt="Casal diante do Rio de Janeiro">'
          assert s.count(old)==1
          s=s.replace(old,old+'<div class="rc3-splash-title" aria-label="FORJA"><span>F<span class="rc3-o">O</span>RJA<span class="rc3-dot">.</span></span><small>CADA DIA, MAIS FORTE.</small></div>')
          styles='.rc3-splash-title{position:absolute;top:9%;left:0;right:0;height:21%;background:linear-gradient(#0d100f 72%,#0d100f00);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2%;z-index:1;white-space:nowrap;pointer-events:none}.rc3-splash-title>span{font-family:Arial,Helvetica,sans-serif;font-weight:1000;font-size:clamp(44px,12vw,110px);letter-spacing:-.065em;color:#fff;line-height:1.15;text-shadow:0 3px 4px #000}.rc3-o,.rc3-dot{color:#cff759}.rc3-splash-title small{font-weight:700;letter-spacing:.29em;font-size:clamp(9px,2.1vw,16px);color:#fff;margin-top:6px}'
          assert s.count('</style>')==1
          s=s.replace('</style>',styles+'</style>')
          assert s.count('forja-icon-180-v942.png')==1
          s=s.replace('forja-icon-180-v942.png','forja-icon-rc3-180.png')
          p.write_text(s)
          mf=root/'manifest.webmanifest'
          data=json.loads(mf.read_text())
          data['icons']=[{'src':'./forja-icon-rc3-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},{'src':'./forja-icon-rc3-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}]
          mf.write_text(json.dumps(data,ensure_ascii=False))
          assert "if(!cloud.user&&tab!=='nuvem')" in s,'Privacidade precisa estar no mesmo commit'
          print('Capas e ícones atualizados, privacidade preservada.')
          PY
      - name: Verificar sintaxe
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('public/index.html').read_text()
          Path('/tmp/forja.js').write_text('\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/forja.js
      - name: Commit conjunto
        run: |
          git config user.name "FORJA RC3"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/manifest.webmanifest public/forja-icon-rc3-*.png
          git commit -m "feat: marca mais forte na capa e ícones RC3"
          git push
