name: FORJA RC3 corrigir anexos PDF
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar upload PDF e corrigir tratamento
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/features.js')
          s=p.read_text()
          a="async function uploadMedia(file,kind,view,date,note){const compact=await compactImage(file);"
          b="async function uploadMedia(file,kind,view,date,note){const compact=file.type==='application/pdf'||/\\.pdf$/i.test(file.name)?file:await compactImage(file);"
          assert s.count(a)==1, 'Assinatura do upload alterada, revisão exigida'
          s=s.replace(a,b)
          assert "form.set('file',compact)" in s
          assert "id=\"chatUpload\"" in s
          p.write_text(s)
          print('PDF preservado como PDF; fotos seguem compactação.')
          PY
          node --check public/features.js
      - name: Publicar correção no repositório
        run: |
          git config user.name "FORJA RC3"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/features.js
          git commit -m "fix: preservar PDF no envio de anexos"
          git push
