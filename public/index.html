function saveExtras(){const input=$('extrasInput');if(!input)return;let lines=input.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length>30){alert('Limite de 30 exercícios adicionais por treino.');return}let parsed=[];for(const [i,line] of lines.entries()){let parts=line.split('|').map(x=>x.trim());let sets=Number(parts[1]);if(parts.length!==3||!parts[0]||parts[0].length>100||!Number.isInteger(sets)||sets<1||sets>10||!parts[2]||parts[2].length>30){alert('Confira a linha '+(i+1)+'. Formato: Nome | séries (1 a 10) | repetições.');return}parsed.push([parts[0],sets,parts[2],'Exercício personalizado: ajuste amplitude e carga conforme sua orientação profissional.'])}const previous=structuredClone(state.extraExercises||{});const draft=state.drafts[sel];if(draft&&Object.keys(draft.entries||{}).length&&!confirm('Alterar a lista de exercícios descartará apenas o rascunho deste treino. As sessões concluídas ficam preservadas. Continuar?'))return;const oldDraft=state.drafts[sel];state.extraExercises={...state.extraExercises,[sel]:parsed};delete state.drafts[sel];if(save()){treino();alert('Exercícios adicionais atualizados. Histórico preservado.')}else{state.extraExercises=previous;if(oldDraft)state.drafts[sel]=oldDraft}}function finish(){let code=sel,d=initDraft(code);const mainTotal=getEx(code).reduce((num,exItem)=>num+exItem[1],0);const mainDone=Object.values(d.entries).filter(entry=>entry.done).length;const hasBonusDone=Object.values(d.bonus||{}).some(bonusItem=>bonusItem.done);const leftMins=bonusRemaining(d);if(code!=='CR'&&mainDone===mainTotal&&leftMins>=5&&!hasBonusDone){if(confirm(`Completou o treino principal e ainda restam ${leftMins} minutos na sua janela de 60 min!\n\nDeseja realizar o exercício BÔNUS antes de salvar?`)){const bZone=$('bonusZone');if(bZone){bZone.classList.add('bonus-highlight');bZone.scrollIntoView({behavior:'smooth',block:'center'});}return}}if(code==='CR'){if(!(Number.isFinite(Number(d.distance))&&Number.isFinite(Number(d.minutes function showWorkoutHistory(id){

 const display=$('restDisplay'),status=$('restStatus'),toggle=$('restToggle');if(display)display.textContent=formatted;const fill=$('restFill'),track=$('restTrack');if(fill)fill.style.width=(100-(remaining/REST_DURATION*100))+'%';if(track)track.setAttribute('aria-valuenow',String(Math.round(90-remaining/1000)));if(status)status.textContent=rest.phase==='running'?'Descanso em andamento.':rest.phase==='paused'?'Descanso pausado.':rest.phase==='done'?'Descanso concluído. Próxima série quando estiver pronto.':'Ao concluir uma série, o descanso começa.';if(toggle)toggle.textContent=rest.phase==='running'?'PAUSAR':rest.phase==='paused'?'CONTINUAR':'INICIAR 90s';
 const dock=typeof $==='function'?$('restDock'):null;if(dock&&dock.classList){const isTreinoTab=typeof tab==='undefined'||tab==='treino';const mainTimer=document.getElementById('restDisplay');const mainBounds=mainTimer?.getBoundingClientRect();const mainVisible=!!mainBounds&&mainBounds.bottom>0&&mainBounds.top<window.innerHeight;const active=isTreinoTab&&!mainVisible&&(rest.phase==='running'||rest.phase==='paused'||rest.phase==='done');dock.classList.toggle('is-hidden',!active);const dockTime=$('restDockTime'),dockFill=$('restDockFill'),dockToggle=$('restDockToggle');if(dockTime)dockTime.textContent=formatted;if(dockFill)dockFill.style.width=(100-(remaining/REST_DURATION*100))+'%';if(dockToggle)dockToggle.textContent=rest.phase==='running'?'PAUSAR':rest.phase==='paused'?'CONTINUAR':'REINICIAR';}
 document.title=rest.phase==='running'?formatted+' · FORJA':rest.phase==='done'?'Descanso concluído · FORJA':'FORJA';
}
function restStart(){rest={phase:'running',endAt:Date.now()+REST_DURATION,remaining:REST_DURATION};restPersist();restRefresh()}
function restToggle(){if(rest.phase==='running'){const remaining=restRemaining();if(remaining===0){restRefresh();return}rest={phase:'paused',remaining,endAt:0};restPersist();restRefresh()}else if(rest.phase==='paused'){rest={phase:'running',remaining:rest.remaining,endAt:Date.now()+rest.remaining};restPersist();restRefresh()}else restStart()}
function restReset(){rest={phase:'idle',endAt:0,remaining:REST_DURATION};restPersist();restRefresh()}
function restInstall(){if(restInterval===null)restInterval=setInterval(restRefresh,1000);document.addEventListener('visibilitychange',restRefresh);window.addEventListener('pageshow',restRefresh);document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(action==='restStart')restStart();else if(action==='restToggle')restToggle();else if(action==='restReset')restReset()});restRefresh()}
// END_REST_TIMER

restInstall();

render();
